name: Update pnpm lockfile for Expo mobile integration
on:
  push:
    branches: [feat/expo-patient-and-web-ports]
permissions:
  contents: write
jobs:
  sync-lockfile:
    if: github.repository == 'Alisina137/dentist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve mobile dependencies and regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if modified
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock Expo patient mobile dependencies"
          git push origin HEAD:feat/expo-patient-and-web-ports
