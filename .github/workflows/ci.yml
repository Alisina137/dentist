name: Phase quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Initial lockfile export
        run: |
          echo DANDAN_LOCK_START
          cat pnpm-lock.yaml
          echo DANDAN_LOCK_END
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
