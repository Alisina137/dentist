name: Phase quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dandan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dandan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify Expo SDK dependencies
        run: pnpm --filter @dandanlink/mobile exec expo install --check
      - run: pnpm build
      - name: Bundle Expo patient app for Android
        run: pnpm --filter @dandanlink/mobile exec expo export --platform android --output-dir .expo-export
      - name: HTTP auth integration against PostgreSQL
        env:
          NODE_ENV: test
          # Test and production environments MUST ignore this flag.
          DEV_SKIP_EMAIL_VERIFICATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dandan_test
          BETTER_AUTH_SECRET: ci_test_secret_only_not_for_public_use_0123456789
          API_BASE_URL: http://localhost:4000
          CLINIC_WEB_URL: http://localhost:3001
          ADMIN_WEB_URL: http://localhost:3000
          PATIENT_WEB_URL: http://localhost:3002
        run: |
          pnpm db:migrate
          pnpm --filter @dandanlink/api start > /tmp/dandanlink-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4000/ready > /dev/null 2>&1; then break; fi
            sleep 1
          done
          PH01_API_LOG=/tmp/dandanlink-api.log node tests/auth-integration.mjs
          node tests/phase02-integration.mjs
          node tests/phase03-integration.mjs
          node tests/phase04-integration.mjs
          node tests/phase05-integration.mjs
          node tests/phase06-integration.mjs
          node tests/dev-no-email-integration.mjs
