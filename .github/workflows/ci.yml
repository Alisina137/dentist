name: Phase quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dandan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dandan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install PostgreSQL backup clients for PH19 restore drill
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify Expo SDK dependencies
        run: pnpm --filter @dandanlink/mobile exec expo install --check
      - run: pnpm build
      - name: Bundle Expo patient app for Android
        run: pnpm --filter @dandanlink/mobile exec expo export --platform android --output-dir .expo-export
      - name: Bundle Expo patient app for iOS (JS bundle only)
        run: pnpm --filter @dandanlink/mobile exec expo export --platform ios --output-dir .expo-export-ios
      - name: HTTP auth integration against PostgreSQL
        env:
          NODE_ENV: test
          # Test and production environments MUST ignore this flag.
          DEV_SKIP_EMAIL_VERIFICATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dandan_test
          BETTER_AUTH_SECRET: ci_test_secret_only_not_for_public_use_0123456789
          API_BASE_URL: http://localhost:4000
          CLINIC_WEB_URL: http://localhost:3001
          ADMIN_WEB_URL: http://localhost:3000
          PATIENT_WEB_URL: http://localhost:3002
        run: |
          pnpm db:migrate
          pnpm --filter @dandanlink/api start > /tmp/dandanlink-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4000/ready > /dev/null 2>&1; then break; fi
            sleep 1
          done
          PH01_API_LOG=/tmp/dandanlink-api.log node tests/auth-integration.mjs
          node tests/phase02-integration.mjs
          node tests/phase03-integration.mjs
          node tests/phase04-integration.mjs
          node tests/phase05-integration.mjs
          node tests/phase06-integration.mjs
          node tests/phase07-integration.mjs
          node tests/phase08-integration.mjs
          node tests/phase09-integration.mjs
          node tests/phase10-integration.mjs
          node tests/phase11-integration.mjs
          node tests/phase12-integration.mjs
          node tests/phase13-integration.mjs
          node tests/phase14-integration.mjs
          node tests/phase15-integration.mjs || { grep 'PH15 booking error' /tmp/dandanlink-api.log | tail -n 10 || true; exit 1; }
          node tests/phase16-integration.mjs
          node tests/phase17-integration.mjs
          node tests/admin-phase-c-integration.mjs
          node tests/phase18-integration.mjs
          node tests/admin-phase-f-integration.mjs
          # Stage L runs PH19's previously unexecuted owner export, audit and
          # 100-contender booking suite, then new cross-role HTTP security checks.
          node tests/stage-l-security-integration.mjs
          node tests/clinic-phase-15-integration.mjs
          node tests/clinic-phase-16-integration.mjs
          NODE_ENV=test node scripts/verify-test-backup-restore.mjs
          node tests/dev-no-email-integration.mjs
